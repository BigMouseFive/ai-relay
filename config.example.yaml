# API key 等秘密放入此文件（相对 config.yaml），例如：
# AI_RELAY_INTERNAL_OPENAI_API_KEY='轮换后的新 key'
# 该文件已被 .gitignore 忽略；进程环境变量优先于该文件。
environment_file: .env

server:
  host: 127.0.0.1
  port: 8600

webbridge:
  base_url: http://127.0.0.1:10086
  command_timeout_seconds: 60
  status_timeout_seconds: 5

# 统一执行目标。每个 target 的 count 都是独立并发槽数量。
# 支持多个同类型 target；id 必须全局唯一。
targets:
  # ---- 浏览器 WebBridge ----
  - id: kimi-browser-fast
    type: webbridge
    site: kimi
    model: "K2.6"
    count: 3

  - id: deepseek-browser-default
    type: webbridge
    site: deepseek
    model: ""
    count: 3

  - id: minimax-browser-default
    type: webbridge
    site: minimax
    model: ""
    count: 3

  # ---- ACP / Cursor agent CLI ----
  # Cursor Agent CLI 实际非交互命令：
  # agent --print --output-format text --mode ask --workspace <dir> <prompt>
  # ask/plan 都是只读模式；不会开启 --force / --yolo。
  # - id: cursor-agent-project-a
  #   type: acp
  #   command: agent
  #   args: []
  #   working_directory: "../your-workspace"
  #   mode: ask                 # ask | plan
  #   output_format: text       # text | json | stream-json
  #   trust_workspace: true
  #   pass_workspace: true
  #   # 可选：绕过 Keychain，使用 .env 中的 Cursor API key。
  #   # api_key_env: CURSOR_API_KEY
  #   # endpoint: "https://api2.cursor.sh"
  #   count: 2
  #   timeout_seconds: 600
  #   output_max_chars: 200000
  #   graceful_shutdown_seconds: 5

  # 可以配置多个 ACP workspace：
  # - id: cursor-agent-project-b
  #   type: acp
  #   command: agent
  #   working_directory: "../another-workspace"
  #   mode: plan
  #   output_format: text
  #   count: 1

  # ---- OpenAI-compatible API ----
  # API key 只能从环境变量读取，绝不能写入 config.yaml 或提交到仓库。
  # 使用前在服务运行环境设置：
  # export AI_RELAY_INTERNAL_OPENAI_API_KEY='替换为轮换后的新 key'
  # - id: internal-openai-default
  #   type: openai_compatible
  #   base_url: "http://10.67.8.60:18080/v1"
  #   api_key_env: AI_RELAY_INTERNAL_OPENAI_API_KEY
  #   model: "gpt-5.6-terra"
  #   count: 4
  #   timeout_seconds: 120
  #   max_retries: 2
  #   allow_model_override: false
  #   max_output_tokens: 4096

  # 第二个 API target 可以使用独立模型/并发/key 环境变量：
  # - id: internal-openai-fast
  #   type: openai_compatible
  #   base_url: "http://10.67.8.60:18080/v1"
  #   api_key_env: AI_RELAY_INTERNAL_OPENAI_FAST_KEY
  #   model: "填写另一个实际可用模型 ID"
  #   count: 8
  #   timeout_seconds: 60
  #   max_retries: 1
  #   allow_model_override: true
  #   allowed_models: ["模型-a", "模型-b"]

# workers 为旧浏览器配置兼容字段。新部署优先使用上方 targets，二者可共存。
workers: []

task:
  timeout_seconds: 600
  retention_seconds: 3600
  max_prompt_chars: 12000
  stall_seconds: 120
  hard_timeout_seconds: 300
  max_retries: 3
  retry_switch_site: false
  max_queue_wait_seconds: 3600
  retry_initial_delay_seconds: 3
  retry_max_delay_seconds: 60

queue:
  max_size: 100

# /v1 未指定 target 时的自动路由。显式 target 始终优先。
routing:
  default_mode: adaptive
  window_seconds: 604800
  min_samples: 5
  exploration_weight: 0.08
  latency_reference_seconds: 60
  failure_penalty: 0.50
  outcome_unknown_penalty: 0.85

dashboard:
  history_size: 100

storage:
  db_path: data/ai-relay.db
  terminal_retention_seconds: 2592000
  metadata_retention_seconds: 7776000

erp:
  register_url: ""
  node_name: ""
  advertise_url: ""
  token: ""
  interval_seconds: 30
